name: pst
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.2
  firebase_storage: ^12.2.3

  # State Management (BLoC)
  flutter_bloc: ^8.1.3
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.2.1

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Networking
  dio: ^5.7.0

  # Geolocation
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation (for injectable)
  build_runner: ^2.4.8
  injectable_generator: ^2.6.1

flutter:
  uses-material-design: true
